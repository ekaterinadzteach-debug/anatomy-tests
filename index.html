<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анатомия: тесты по остеологии</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#4a3328; --muted:#8a7366; --line:#ead9c9; --shadow:#e6d2bf;
    --paper:#fffaf3; --cream:#fbf3e6;
    --accent:#c99a7a; --soft:#f4e3d4; --tint:#fbf3ea;
    --ok:#3f8a5c; --ok-bg:#e1f3e6; --ok-line:#7cc097;
    --bad:#b9505a; --bad-bg:#fbe3e3; --bad-line:#e4999c;
    --mid:#b07a2a; --mid-bg:#fbefd5;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Nunito",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background-color:var(--tint);background-image:var(--pattern);background-size:280px 280px;line-height:1.45;transition:background-color .3s}
  button{font-family:inherit}

  /* hamburger */
  .burger{position:fixed;top:12px;left:12px;z-index:30;width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--paper);box-shadow:0 3px 0 var(--shadow);cursor:pointer;display:grid;place-items:center;padding:0}
  .burger span,.burger span::before,.burger span::after{display:block;width:18px;height:2.5px;border-radius:2px;background:var(--ink);position:relative;content:""}
  .burger span::before{position:absolute;top:-6px}
  .burger span::after{position:absolute;top:6px}
  .burger:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}

  .app{display:flex;min-height:100vh}
  aside{width:300px;flex:none;background:var(--paper);border-right:2px solid var(--line);padding:66px 14px 20px;position:sticky;top:0;height:100vh;overflow:auto;transition:margin-left .25s}
  body.closed aside{margin-left:-300px}
  aside h1{font-size:18px;margin:0 6px 2px;font-weight:800}
  aside p.sub{font-size:13px;color:var(--muted);margin:0 6px 14px}
  .topic{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:2px solid transparent;background:none;padding:9px 10px;border-radius:16px;cursor:pointer;color:inherit;margin-bottom:6px;font-size:14px}
  .topic:hover{background:var(--cream)}
  .topic.active{background:var(--tsoft);border-color:var(--tacc)}
  .ticon{flex:none;width:40px;height:40px;border-radius:12px;background:var(--tsoft);display:grid;place-items:center}
  .ticon svg{width:30px;height:30px}
  .tname{font-weight:700;line-height:1.25}
  .badge{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;padding:1px 9px;border-radius:20px;background:var(--cream);color:var(--muted)}
  .badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.mid{background:var(--mid-bg);color:var(--mid)} .badge.bad{background:var(--bad-bg);color:var(--bad)}
  .backdrop{display:none}

  main{flex:1;min-width:0;padding:66px 32px 80px}
  .wrap{max-width:820px;margin:0 auto}
  .hero{position:relative;overflow:hidden;background:var(--soft);border:2px solid var(--line);border-radius:22px;padding:20px 150px 20px 22px;box-shadow:0 4px 0 var(--shadow);margin-bottom:18px;min-height:112px}
  .hero .kicker{font-size:13px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
  .hero h2{margin:2px 0 0;font-size:23px;font-weight:800;line-height:1.2}
  .hero .art{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;align-items:flex-end;gap:2px}
  .hero .art svg{width:64px;height:64px} .hero .art svg:nth-child(2){width:46px;height:46px;margin-bottom:34px}
  .progress{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;font-weight:700;margin:0 4px 18px}
  .bar{flex:1;height:10px;background:var(--paper);border:2px solid var(--line);border-radius:10px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s;border-radius:10px}

  .q{background:var(--paper);border:2px solid var(--soft);border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:0 3px 0 var(--shadow)}
  .q h3{margin:0 0 10px;font-size:16px;font-weight:700}
  .q h3 .n{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:9px;background:var(--soft);color:var(--ink);font-size:13px;margin-right:8px;vertical-align:1px}
  .opt{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;font-size:15px;color:inherit;background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px 13px;margin:6px 0;cursor:pointer}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--tint)}
  .opt:disabled{cursor:default}
  .opt .l{flex:none;font-weight:800;color:var(--accent);min-width:20px}
  .opt .t{flex:1}
  .opt .tag{flex:none;font-size:12px;font-weight:800;white-space:nowrap;padding-top:2px}
  .opt.correct{background:var(--ok-bg);border-color:var(--ok-line);color:#2d5a3c}
  .opt.correct .l,.opt.correct .tag{color:var(--ok)}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad-line);color:#7a2f35}
  .opt.wrong .l,.opt.wrong .tag{color:var(--bad)}
  .opt.dim{opacity:.6}
  .expl{margin:2px 0 8px 14px;padding:9px 13px;border-left:4px solid var(--ok-line);background:#f3fbf5;border-radius:0 12px 12px 0;font-size:14px}
  .verdict{font-weight:800;margin-bottom:2px}
  .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}

  .result{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:20px 22px;margin:24px 0 16px;box-shadow:0 4px 0 var(--shadow)}
  .result.ok{background:var(--ok-bg);border-color:var(--ok-line)} .result.mid{background:var(--mid-bg);border-color:#e7c27f} .result.bad{background:var(--bad-bg);border-color:var(--bad-line)}
  .result .row{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end;margin:8px 0 12px}
  .big{font-size:38px;font-weight:800;line-height:1}
  .lbl{font-size:13px;color:var(--muted);font-weight:700}
  .scale{font-size:13px;color:var(--muted);margin-top:8px}
  .btn{font-size:15px;border:2px solid transparent;background:var(--accent);color:#fff;padding:8px 16px;border-radius:14px;cursor:pointer;font-weight:800;box-shadow:0 3px 0 rgba(74,51,40,.18)}
  .btn.ghost{background:var(--paper);color:var(--ink);border-color:var(--line)}
  .facts{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px 22px;box-shadow:0 4px 0 var(--shadow)}
  .facts h3{margin:0 0 8px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
  .facts h3 svg{width:28px;height:28px}
  .facts ol{margin:0;padding-left:22px} .facts li{margin:6px 0} .facts li::marker{color:var(--accent);font-weight:800}
  .hint{color:var(--muted)}
  .homegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
  .homecard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--tsoft);border:2px solid var(--line);border-radius:18px;padding:12px;cursor:pointer;color:inherit;font-size:14px;box-shadow:0 3px 0 var(--shadow)}
  .homecard .ticon{background:#fff}

  /* ---------- narrow / mobile ---------- */
  @media (max-width:760px){
    aside{position:fixed;left:0;top:0;bottom:0;z-index:20;height:auto;box-shadow:4px 0 0 var(--shadow);margin-left:0;transform:translateX(0);transition:transform .25s}
    body.closed aside{margin-left:0;transform:translateX(-105%)}
    body:not(.closed) .backdrop{display:block;position:fixed;inset:0;background:rgba(74,51,40,.25);z-index:15}
    main{padding:62px 12px 60px}
    .hero{padding:14px 70px 14px 16px;min-height:84px;border-radius:18px}
    .hero .art svg:not(:first-child){display:none}
    .hero h2{font-size:19px}
    .hero .art svg{width:44px;height:44px} .hero .art svg:nth-child(2){width:32px;height:32px;margin-bottom:24px}
    .q{padding:14px 14px 10px;border-radius:16px}
    .q h3{font-size:15px}
    /* ответы — простым списком, как в Google Формах */
    .opt{border:0;background:none;border-radius:8px;padding:6px 4px;margin:0;font-size:15px;align-items:center}
    .opt:hover:not(:disabled){background:none}
    .opt .l{display:none}
    .opt::before{content:"";flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);background:#fff;box-sizing:border-box}
    .opt.correct{background:var(--ok-bg)} .opt.correct::before{border:5px solid var(--ok)}
    .opt.wrong{background:var(--bad-bg)} .opt.wrong::before{border:5px solid var(--bad)}
    .opt .tag{font-size:11px;padding:0}
    .expl{margin:4px 0 8px 2px;font-size:14px}
    .big{font-size:30px}
  }
</style>
</head>
<body>
<button class="burger" id="burger" aria-label="Меню тем"><span></span></button>
<div class="backdrop" id="backdrop"></div>
<div class="app">
  <aside>
    <h1>Анатомия: остеология</h1>
    <p class="sub">Выбери тему — откроется тест</p>
    <div id="topics"></div>
  </aside>
  <main><div class="wrap" id="main"></div></main>
</div>
<script>
const DATA = [{"id":1,"name":"Осевой скелет. Позвоночный столб. Грудная клетка","q":[{"q":"Какой метод исследования можно применить только на трупе?","o":["Мацерация","Рентгенография","УЗИ","Пальпация"],"a":0,"e":"Мацерация — освобождение кости от мягких тканей, чтобы получить «чистый» скелет. Рентген, УЗИ и пальпацию применяют на живом человеке."},{"q":"На каком языке составлена международная анатомическая терминология?","o":["Греческом","Английском","Немецком","Латинском"],"a":3,"e":"Terminologia Anatomica — на латыни. Греческие корни встречаются в клинических словах (spondylos — позвонок), но официальные названия латинские."},{"q":"Что такое система органов?","o":["Любая группа тканей","Органы, объединённые общей функцией и происхождением","Органы одной области тела","Органы одного размера"],"a":1,"e":"Например, костная система — все кости, их объединяет общая функция (опора) и общее происхождение."},{"q":"Какая плоскость делит тело на правую и левую части?","o":["Фронтальная","Горизонтальная","Сагиттальная","Поперечная"],"a":2,"e":"Сагиттальная плоскость идёт спереди назад, «как стрела» (sagitta — стрела). Фронтальная делит на перед и зад, горизонтальная — на верх и низ."},{"q":"Как называется орган, лежащий ближе к срединной плоскости?","o":["Латеральный","Дорсальный","Дистальный","Медиальный"],"a":3,"e":"Медиальный — ближе к середине тела, латеральный — дальше от неё, в сторону. Пример: мизинец медиальнее большого пальца (в анатомической позиции ладони вперёд)."},{"q":"Что означает термин «дистальный»?","o":["Дальше от туловища (на конечности)","Ближе к туловищу","Ближе к спине","Ближе к коже"],"a":0,"e":"Дистальный — дальше от туловища, проксимальный — ближе. Кисть дистальнее плеча. Используется в основном для конечностей."},{"q":"Латинское название термина «задний»:","o":["anterior","posterior","inferior","superior"],"a":1,"e":"posterior — задний, anterior — передний, superior — верхний, inferior — нижний. Запоминать парами."},{"q":"Что входит в осевой скелет?","o":["Кости конечностей","Только позвоночный столб","Позвоночный столб, грудная клетка и череп","Пояса конечностей"],"a":2,"e":"Осевой скелет — «ось» тела: позвоночник, грудная клетка, череп. Кости конечностей (пояса + свободные части) — добавочный скелет."},{"q":"Какая функция скелета связана с депо кальция и фосфора?","o":["Участие в минеральном обмене","Защитная","Опорная","Локомоторная"],"a":0,"e":"Кости — запас минеральных солей. При нехватке кальция в крови организм берёт его из костей."},{"q":"К какой группе относится позвонок?","o":["Трубчатые","Плоские","Сесамовидные","Смешанные (неправильные)"],"a":3,"e":"Позвонок состоит из частей разной формы и разного происхождения (тело, дуга, отростки), поэтому это смешанная кость. Сюда же — кости основания черепа."},{"q":"Какая кость является воздухоносной?","o":["Теменная","Верхняя челюсть","Лопатка","Надколенник"],"a":1,"e":"Воздухоносные кости имеют полость с воздухом: верхняя челюсть (верхнечелюстная пазуха), лобная, клиновидная, решётчатая. Важно для стоматолога: корни верхних зубов близко к пазухе."},{"q":"Как называется средняя часть трубчатой кости?","o":["Эпифиз","Метафиз","Диафиз","Апофиз"],"a":2,"e":"Диафиз — тело кости (с костномозговой полостью), эпифизы — концы, метафиз — участок между ними."},{"q":"Надколенник относится к костям:","o":["Плоским","Губчатым коротким","Воздухоносным","Сесамовидным"],"a":3,"e":"Сесамовидные кости лежат в толще сухожилий и помогают работе мышц (как блок). Надколенник — в сухожилии четырёхглавой мышцы бедра."},{"q":"Что придаёт кости упругость и эластичность?","o":["Органические вещества (коллаген)","Гидроксиапатит","Соли кальция","Вода"],"a":0,"e":"Органика (коллаген) — упругость, минералы (гидроксиапатит) — твёрдость. Поэтому у детей (больше органики) кости гибкие, у пожилых (больше минералов) — хрупкие."},{"q":"Что является структурной единицей костной ткани?","o":["Остеоцит","Остеон","Трабекула","Эндост"],"a":1,"e":"Остеон — 5–20 костных пластинок-цилиндров вокруг центрального канала с сосудом. Остеоцит — это клетка, а не структурная единица ткани."},{"q":"За счёт чего кость растёт в толщину?","o":["Суставного хряща","Жёлтого костного мозга","Надкостницы","Эндоста"],"a":2,"e":"Внутренний (остеогенный) слой надкостницы содержит остеобласты — они строят новую кость снаружи. Надкостница же обеспечивает сращение переломов."},{"q":"Чем покрыта кость в местах соединения с другими костями (суставные поверхности)?","o":["Суставным хрящом","Эндостом","Надкостницей","Компактным веществом без покрытия"],"a":0,"e":"Надкостница покрывает кость везде, кроме суставных поверхностей — там суставной хрящ, он гладкий и уменьшает трение."},{"q":"Какие стадии проходит кость в развитии (по порядку)?","o":["Хрящевая → перепончатая → костная","Только хрящевая → костная","Костная → хрящевая","Перепончатая → хрящевая → костная"],"a":3,"e":"Сначала соединительная ткань (перепончатая стадия), потом хрящ, потом кость. Первичные кости (свод черепа) пропускают стадию хряща."},{"q":"Что такое эндохондральное окостенение?","o":["Кость образуется снаружи хряща","Точки окостенения появляются внутри хряща","Кость образуется из соединительной ткани без хряща","Разрушение кости"],"a":1,"e":"Endo — внутри, chondros — хрящ. Перихондральное — снаружи хряща (peri — вокруг). Без хряща — эндесмальное."},{"q":"Благодаря чему трубчатая кость растёт в длину?","o":["Надкостнице","Остеокластам","Метаэпифизарному хрящу (зоне роста)","Костномозговой полости"],"a":2,"e":"Метаэпифизарный хрящ находится между метафизом и эпифизом. Когда он заменяется костью (к 18–25 годам), рост в длину прекращается. На рентгене по этим зонам и ядрам окостенения определяют «костный возраст»."},{"q":"Сколько позвонков в грудном отделе?","o":["7","5","10","12"],"a":3,"e":"Формула: шейных 7, грудных 12, поясничных 5, крестцовых 5, копчиковых 3–5. Грудных 12 — по числу пар рёбер."},{"q":"Какие изгибы позвоночника являются первичными (врождёнными)?","o":["Грудной и крестцовый кифозы","Шейный и поясничный лордозы","Все четыре","Сколиоз"],"a":0,"e":"Кифозы (выпуклость назад) есть уже у новорождённого. Лордозы — вторичные: шейный появляется, когда ребёнок держит голову, поясничный — когда сидит и ходит."},{"q":"Что такое сколиоз?","o":["Изгиб назад","Изгиб вбок (во фронтальной плоскости)","Изгиб вперёд","Сращение позвонков"],"a":1,"e":"Кифоз и лордоз — в сагиттальной плоскости (вперёд-назад), сколиоз — во фронтальной (вбок). Выраженный сколиоз — патология."},{"q":"Что образуют все позвоночные отверстия вместе?","o":["Межпозвоночные отверстия","Крестцовый канал","Позвоночный канал","Поперечные отверстия"],"a":2,"e":"Позвоночное отверстие (между телом и дугой) у каждого позвонка; наложенные друг на друга, они дают позвоночный канал, где лежит спинной мозг."},{"q":"Через межпозвоночные отверстия проходят:","o":["Спинномозговые нервы","Позвоночные артерии","Спинной мозг","Сухожилия"],"a":0,"e":"Межпозвоночные отверстия образованы вырезками соседних позвонков; через них выходят спинномозговые нервы. Позвоночная артерия идёт через поперечные отверстия шейных позвонков — не путать!"},{"q":"Сколько отростков отходит от дуги позвонка?","o":["3","5","4","7"],"a":3,"e":"1 остистый + 2 поперечных + 2 верхних суставных + 2 нижних суставных = 7."},{"q":"Главный признак шейного позвонка:","o":["Рёберные ямки","Отверстие в поперечном отростке","Сосцевидный отросток","Массивное тело"],"a":1,"e":"Поперечное отверстие есть только у шейных позвонков — через него проходит позвоночная артерия к головному мозгу."},{"q":"У какого позвонка нет тела и остистого отростка?","o":["C II — осевой","C VII","C I — атлант","L V"],"a":2,"e":"Атлант — кольцо из передней и задней дуг и двух латеральных масс. Его «тело» в развитии приросло к C II и стало зубом."},{"q":"Как называется отросток тела второго шейного позвонка?","o":["Мыс","Сонный бугорок","Сосцевидный отросток","Зуб"],"a":3,"e":"Зуб (dens) осевого позвонка входит в ямку зуба атланта; вокруг него атлант вместе с головой поворачивается («нет-нет»)."},{"q":"К какому позвонку прижимают сонную артерию для остановки кровотечения?","o":["C VI","C I","C VII","Th I"],"a":0,"e":"Передний бугорок поперечного отростка C VI называется сонным бугорком."},{"q":"Какой позвонок называют выступающим?","o":["C I","C VII","Th XII","L V"],"a":1,"e":"C VII (vertebra prominens) — самый длинный нераздвоенный остистый отросток, хорошо прощупывается у основания шеи; от него начинают счёт позвонков."},{"q":"Рёберные ямки на теле и поперечных отростках имеют:","o":["Шейные позвонки","Поясничные позвонки","Грудные позвонки","Крестец"],"a":2,"e":"К грудным позвонкам крепятся рёбра: головка ребра — к ямкам на теле, бугорок ребра — к ямке поперечного отростка."},{"q":"Остистые отростки горизонтальные, короткие и широкие, а тело самое массивное у:","o":["Поясничных","Грудных","Шейных","Копчиковых"],"a":0,"e":"Поясничные несут самую большую нагрузку → самые массивные. У грудных остистые отростки длинные и направлены вниз, черепицей."},{"q":"Что такое мыс (promontorium)?","o":["Вершина копчика","Бугорок ребра","Отросток атланта","Выступ в полость таза в месте соединения L V с крестцом"],"a":3,"e":"Мыс образуется у основания крестца при его соединении с V поясничным позвонком под углом и вдаётся в полость таза."},{"q":"Из каких частей состоит грудина?","o":["Головка, шейка, тело","Рукоятка, тело, мечевидный отросток","Основание и верхушка","Тело и две дуги"],"a":1,"e":"Рукоятка (вверху), тело (посередине), мечевидный отросток (внизу). Головка-шейка-тело — это части ребра."},{"q":"Какая вырезка грудины непарная?","o":["Ключичная","Рёберная","Яремная","Позвоночная"],"a":2,"e":"Яремная вырезка — одна, по верхнему краю рукоятки. Ключичные — парные (для двух ключиц), рёберных — по 7 с каждой стороны."},{"q":"Угол грудины (Льюиса) — ориентир для определения:","o":["I ребра","C VII","Мечевидного отростка","2-го межреберья"],"a":3,"e":"Угол грудины — место соединения рукоятки и тела, на уровне II ребра. Ниже — 2-е межреберье, где выслушивают клапаны аорты и лёгочного ствола."},{"q":"Какие рёбра называют истинными?","o":["I–VII","VIII–X","XI–XII","I–XII"],"a":0,"e":"Истинные (I–VII) крепятся хрящом прямо к грудине. Ложные (VIII–X) — к хрящу вышележащего ребра. Колеблющиеся (XI–XII) свободно лежат в мышцах."},{"q":"Что образуют хрящи ложных рёбер?","o":["Угол грудины","Рёберную дугу","Ярёмную вырезку","Межрёберные промежутки"],"a":1,"e":"Хрящи VIII–X рёбер присоединяются к вышележащим и вместе образуют рёберную дугу."},{"q":"Что лежит в борозде ребра?","o":["Ничего","Сухожилие","Межрёберные сосуды и нерв","Лёгкое"],"a":2,"e":"Борозда идёт по внутренней поверхности вдоль нижнего края ребра — след межрёберных сосудов и нерва. Поэтому прокол грудной стенки делают по верхнему краю ребра."},{"q":"Что находится на верхней поверхности I ребра?","o":["Бугорок передней лестничной мышцы","Рёберная дуга","Сосцевидный отросток","Ушковидная поверхность"],"a":0,"e":"Бугорок передней лестничной мышцы разделяет борозду подключичной вены (спереди) и борозду подключичной артерии (сзади)."},{"q":"Чего нет у XI и XII рёбер?","o":["Головки","Тела","Хряща","Шейки, угла, бугорка и борозды"],"a":3,"e":"Колеблющиеся рёбра упрощены: нет шейки, угла, бугорка и борозды; не сочленяются с поперечными отростками."},{"q":"Что такое сакрализация?","o":["Отделение I крестцового позвонка","Сращение V поясничного позвонка с крестцом","Сращение атланта с черепом","Расщепление дуги"],"a":1,"e":"Сакрализация (sacrum — крестец): поясничный позвонок «становится» крестцовым. Обратная аномалия — люмбализация (lumbus — поясница): I крестцовый становится поясничным."},{"q":"Как называется расщепление дуги позвонка?","o":["Ассимиляция атланта","Сколиоз","Spina bifida","Люмбализация"],"a":2,"e":"Spina bifida («расщеплённый позвоночник») — дуга не срастается; чаще в поясничном и крестцовом отделах."}],"facts":["Три плоскости: сагиттальная (право/лево), фронтальная (перед/зад), горизонтальная (верх/низ).","Осевой скелет = позвоночник + грудная клетка + череп; добавочный = кости конечностей.","Классификация костей: трубчатые, губчатые, плоские, смешанные, воздухоносные, сесамовидные.","Структурная единица кости — остеон. Надкостница — рост в толщину и сращение переломов.","Формула позвоночника: C7 + Th12 + L5 + S5 + Co3–5.","Кифозы (грудной, крестцовый) — первичные; лордозы (шейный, поясничный) — вторичные.","Шейный позвонок — отверстие в поперечном отростке; грудной — рёберные ямки; поясничный — массивное тело.","Атлант — без тела и остистого отростка; осевой — с зубом; C VII — выступающий; C VI — сонный бугорок.","Рёбра: истинные I–VII, ложные VIII–X, колеблющиеся XI–XII. Грудина: рукоятка, тело, мечевидный отросток.","Аномалии: сакрализация, люмбализация, spina bifida, ассимиляция атланта, добавочные рёбра."]},{"id":2,"name":"Кости мозгового черепа","q":[{"q":"Какой отдел черепа служит вместилищем для головного мозга?","o":["Лицевой","Мозговой","Висцеральный","Основание черепа"],"a":1,"e":"Мозговой череп (neurocranium) окружает мозг. Лицевой — основа лица и начальных отделов пищеварительной и дыхательной систем. Основание — только «пол» мозгового черепа."},{"q":"Сколько всего костей в черепе?","o":["8","14","23","32"],"a":2,"e":"В черепе 23 кости. «8» — это кости только мозгового черепа (6 названий, теменная и височная парные)."},{"q":"Какая кость мозгового черепа парная?","o":["Теменная","Лобная","Клиновидная","Решётчатая"],"a":0,"e":"Парные — теменная и височная. Лобная, затылочная, клиновидная и решётчатая непарные."},{"q":"Глабелла — это:","o":["Отверстие лобной кости","Выступ затылочной кости","Пазуха","Гладкая площадка между надбровными дугами"],"a":3,"e":"Глабелла — гладкая площадка над переносицей между надбровными дугами."},{"q":"Куда открывается лобная пазуха?","o":["В верхний носовой ход","В средний носовой ход","В нижний носовой ход","В глазницу"],"a":1,"e":"Лобная пазуха открывается в средний носовой ход. Клиновидная — в верхний."},{"q":"Через какое отверстие спинной мозг соединяется с головным?","o":["Яремное отверстие","Канал подъязычного нерва","Большое затылочное отверстие","Внутреннее слуховое отверстие"],"a":2,"e":"Большое отверстие окружено всеми частями затылочной кости; через него продолговатый мозг переходит в спинной."},{"q":"С чем сочленяются затылочные мыщелки?","o":["С атлантом","С осевым позвонком","С нижней челюстью","С теменной костью"],"a":0,"e":"Мыщелки ложатся на верхние суставные ямки атланта — атлантозатылочный сустав (кивок «да-да»)."},{"q":"Где лежит гипофиз?","o":["В лобной пазухе","В решётчатом лабиринте","На петушином гребне","В турецком седле"],"a":3,"e":"Турецкое седло — углубление на теле клиновидной кости, в нём гипофиз. Под ним — клиновидная пазуха."},{"q":"Какое образование НЕ находится на большом крыле клиновидной кости?","o":["Круглое отверстие","Овальное отверстие","Зрительный канал","Остистое отверстие"],"a":2,"e":"Зрительный канал — в малом крыле. На большом: круглое, овальное, остистое (спереди назад)."},{"q":"Что проходит через круглое отверстие?","o":["Нижнечелюстной нерв","Верхнечелюстной нерв","Зрительный нерв","Средняя менингеальная артерия"],"a":1,"e":"Верхнечелюстной нерв (V₂) — к верхним зубам. Подсказка: круглое — верхнее."},{"q":"Что проходит через овальное отверстие?","o":["Верхнечелюстной нерв","Лицевой нерв","Нижнечелюстной нерв","Внутренняя сонная артерия"],"a":2,"e":"Нижнечелюстной нерв (V₃) — к нижним зубам и жевательным мышцам."},{"q":"Где находится верхняя глазничная щель?","o":["Между большим и малым крыльями клиновидной кости","В теле клиновидной кости","В пирамиде височной кости","В лобной кости"],"a":0,"e":"Между малым и большим крыльями; через неё в глазницу идут нервы к мышцам глаза."},{"q":"Где находится петушиный гребень?","o":["На клиновидной кости","На затылочной кости","На лобной кости","На решётчатой пластинке решётчатой кости"],"a":3,"e":"Петушиный гребень торчит вверх посередине решётчатой пластинки."},{"q":"Какие носовые раковины относятся к решётчатой кости?","o":["Нижняя","Верхняя и средняя","Только средняя","Все три"],"a":1,"e":"Верхняя и средняя — части решётчатого лабиринта. Нижняя — отдельная кость лицевого черепа."},{"q":"Какая часть височной кости содержит орган слуха и равновесия?","o":["Чешуйчатая","Барабанная","Каменистая (пирамида)","Сосцевидный отросток"],"a":2,"e":"Орган слуха и равновесия — внутри пирамиды (каменистой части)."},{"q":"На какой части височной кости нижнечелюстная ямка?","o":["Чешуйчатой","Барабанной","Пирамиде","Сосцевидном отростке"],"a":0,"e":"У основания скулового отростка на чешуйчатой части; в неё входит головка нижней челюсти (ВНЧС)."},{"q":"Через какой канал височной кости проходит лицевой нерв?","o":["Сонный","Мышечно-трубный","Канал подъязычного нерва","Лицевой"],"a":3,"e":"Лицевой нерв — в лицевом канале; сонный — для внутренней сонной артерии; канал подъязычного нерва — в затылочной кости."},{"q":"Куда открывается клиновидная пазуха?","o":["В средний носовой ход","В верхний носовой ход","В нижний носовой ход","В лобную пазуху"],"a":1,"e":"Клиновидная — в верхний ход, лобная — в средний."},{"q":"Какая кость НЕ воздухоносная?","o":["Лобная","Клиновидная","Решётчатая","Теменная"],"a":3,"e":"Теменная — простая плоская пластинка без полости."}],"facts":["Череп (cranium) = мозговой (neurocranium) + лицевой (viscerocranium). Мозговой делят на свод и основание.","Кости мозгового черепа (6 названий, 8 костей): непарные — лобная, затылочная, клиновидная, решётчатая; парные — теменная, височная.","Затылочная: чешуя, базилярная и 2 латеральные части вокруг большого отверстия; мыщелки сочленяются с атлантом.","Лобная: чешуя, носовая и 2 глазничные части; внутри — лобная пазуха.","Клиновидная: тело + малые крылья + большие крылья + крыловидные отростки; в теле — клиновидная пазуха и турецкое седло (гипофиз).","Отверстия большого крыла: круглое, овальное, остистое. Зрительный канал — в малом крыле; между крыльями — верхняя глазничная щель.","Решётчатая: решётчатая пластинка (с петушиным гребнем), перпендикулярная пластинка, 2 решётчатых лабиринта; от лабиринта — верхняя и средняя носовые раковины.","Височная — самая сложная: чешуйчатая, каменистая (пирамида) и барабанная части; в пирамиде — орган слуха и равновесия.","На височной кости: скуловой отросток, нижнечелюстная ямка (ВНЧС), сосцевидный и шиловидный отростки; каналы: сонный, лицевой, мышечно-трубный.","Воздухоносные кости мозгового черепа: лобная, клиновидная, решётчатая (+ сосцевидный отросток височной) — околоносовые пазухи."]},{"id":3,"name":"Кости лицевого черепа","q":[{"q":"Какая кость черепа — единственная подвижная?","o":["Верхняя челюсть","Подъязычная","Нижняя челюсть","Сошник"],"a":2,"e":"Нижняя челюсть соединена с черепом суставом (ВНЧС). Подъязычная с черепом не соединена."},{"q":"Сколько отростков у верхней челюсти?","o":["4","2","3","5"],"a":0,"e":"Лобный (вверх), скуловой (латерально), нёбный (медиально), альвеолярный (вниз)."},{"q":"Куда направлен нёбный отросток верхней челюсти?","o":["Вверх","Медиально","Латерально","Вниз"],"a":1,"e":"Медиально — встречается с отростком другой стороны, образуя большую часть твёрдого нёба."},{"q":"Какой поверхности НЕТ у тела верхней челюсти?","o":["Передней","Глазничной","Носовой","Височной"],"a":3,"e":"Поверхности: передняя, глазничная, носовая и ПОДвисочная. Височной нет."},{"q":"Подглазничное отверстие — ориентир для какой анестезии?","o":["Инфраорбитальной","Туберальной","Мандибулярной","Ментальной"],"a":0,"e":"Инфраорбитальная («под глазницей») — для передних верхних зубов."},{"q":"Где альвеолярные отверстия, ведущие к молярам?","o":["На передней поверхности","В клыковой ямке","На бугре верхней челюсти","На нёбном отростке"],"a":2,"e":"На бугре (tuber) верхней челюсти — туберальная анестезия верхних моляров."},{"q":"Какая зубная альвеола самая глубокая?","o":["Центрального резца","Первого моляра","Премоляра","Клыка"],"a":3,"e":"Альвеола клыка — до 19 мм: у клыка самый длинный корень."},{"q":"Корни каких зубов чаще прилежат ко дну верхнечелюстной пазухи?","o":["1-го и 2-го моляров","Резцов","Клыков","Премоляров"],"a":0,"e":"Поэтому воспаление корня моляра может перейти в пазуху, а при удалении можно вскрыть пазуху."},{"q":"Куда открывается верхнечелюстная пазуха?","o":["В верхний носовой ход","В средний носовой ход","В нижний носовой ход","В полость рта"],"a":1,"e":"В средний ход через верхнечелюстную расщелину."},{"q":"Сколько альвеол на нижней челюсти у взрослого?","o":["8","12","16","32"],"a":2,"e":"16 — по 8 с каждой стороны: 2 резца, клык, 2 премоляра, 3 моляра."},{"q":"Подбородочный выступ — это след:","o":["Прикрепления мышцы","Сращения двух половин челюсти","Прорезывания зубов","Канала нижней челюсти"],"a":1,"e":"Нижняя челюсть развивается из 2 половин, они срастаются на 2-м году (симфиз)."},{"q":"Где начинается канал нижней челюсти?","o":["У подбородочного отверстия","У отверстия нижней челюсти на внутренней поверхности ветви","На венечном отростке","На дне альвеол"],"a":1,"e":"Начинается отверстием нижней челюсти (мандибулярная анестезия), заканчивается подбородочным отверстием."},{"q":"На каком отростке находится головка нижней челюсти?","o":["На венечном","На угле челюсти","На теле","На мыщелковом"],"a":3,"e":"Мыщелковый отросток заканчивается головкой, она входит в нижнечелюстную ямку (ВНЧС)."},{"q":"Какая мышца прикрепляется к венечному отростку?","o":["Височная","Латеральная крыловидная","Жевательная","Двубрюшная"],"a":0,"e":"Височная мышца поднимает челюсть. Латеральная крыловидная — к мыщелковому отростку."},{"q":"Чем образовано костное нёбо?","o":["Только нёбными костями","Сошником и нёбными костями","Нёбными отростками верхних челюстей и горизонтальными пластинками нёбных костей","Альвеолярными отростками"],"a":2,"e":"Спереди — нёбные отростки верхних челюстей, сзади — горизонтальные пластинки нёбных костей."},{"q":"Что образует скуловую дугу?","o":["Височный отросток скуловой кости и скуловой отросток височной кости","Лобный отросток скуловой кости и лобная кость","Скуловой отросток верхней челюсти и скуловая кость","Теменная и височная кости"],"a":0,"e":"Две кости тянут отростки друг к другу: каждый назван в честь «соседа»."},{"q":"Какая носовая раковина — самостоятельная кость?","o":["Верхняя","Средняя","Наивысшая","Нижняя"],"a":3,"e":"Нижняя — отдельная парная кость; верхняя и средняя — части решётчатой."},{"q":"Какая кость лицевого черепа непарная?","o":["Слёзная","Сошник","Носовая","Скуловая"],"a":1,"e":"Сошник — один, посередине перегородки носа. Также непарные: нижняя челюсть, подъязычная."},{"q":"В какой области тело нижней челюсти самое тонкое?","o":["У моляров","У резцов","У премоляров","У угла челюсти"],"a":2,"e":"Тоньше всего у премоляров, толще всего у моляров."},{"q":"Какой ориентир у ментальной анестезии?","o":["Подбородочное отверстие","Отверстие нижней челюсти","Бугор верхней челюсти","Подглазничное отверстие"],"a":0,"e":"Mentum — подбородок. Обезболивает передние нижние зубы, губу, подбородок."}],"facts":["Кости лицевого черепа: парные — верхняя челюсть, нёбная, скуловая, носовая, слёзная, нижняя носовая раковина; непарные — нижняя челюсть, сошник, подъязычная.","Верхняя челюсть: тело + 4 отростка (лобный — вверх, альвеолярный — вниз, нёбный — медиально, скуловой — латерально).","Тело верхней челюсти: 4 поверхности — передняя, глазничная, подвисочная, носовая; внутри — верхнечелюстная пазуха.","Верхнечелюстная пазуха — самая большая; открывается в средний носовой ход; к её дну близко подходят корни 1-го и 2-го моляров.","Альвеолярный отросток: 8 альвеол с каждой стороны; самая глубокая — альвеола клыка (до 19 мм); снаружи — альвеолярные возвышения.","Нижняя челюсть — единственная подвижная кость черепа: тело (основание + альвеолярная часть, 16 альвеол) и 2 ветви.","Ветвь нижней челюсти: мыщелковый отросток (головка → ВНЧС) и венечный отросток (крепится височная мышца).","Канал нижней челюсти: от отверстия нижней челюсти (внутренняя поверхность ветви) до подбородочного отверстия.","Точки анестезии: подглазничное отверстие, бугор верхней челюсти, отверстие нижней челюсти, подбородочное отверстие.","Костное нёбо = нёбные отростки верхних челюстей + горизонтальные пластинки нёбных костей."]},{"id":4,"name":"Череп в целом. Нормы. Возрастная анатомия","q":[{"q":"Как называется вид черепа снизу?","o":["Лицевая норма","Вертикальная норма","Латеральная норма","Базилярная норма"],"a":3,"e":"Базилярная — снизу (basis — основание). Лицевая — спереди, латеральная — сбоку, вертикальная — сверху."},{"q":"Какую форму имеет глазница?","o":["Шара","Четырёхсторонней пирамиды","Куба","Трёхгранной пирамиды"],"a":1,"e":"4 стенки; основание (вход) вперёд, верхушка назад."},{"q":"Передний вход в костную полость носа:","o":["Хоаны","Грушевидная апертура","Носослёзный канал","Рваное отверстие"],"a":1,"e":"Спереди — грушевидная апертура, сзади (в глотку) — хоаны."},{"q":"Чем образована костная перегородка носа?","o":["Перпендикулярной пластинкой решётчатой кости и сошником","Носовыми костями","Нёбными костями","Нижними носовыми раковинами"],"a":0,"e":"Перпендикулярная пластинка решётчатой кости + сошник."},{"q":"Что открывается в нижний носовой ход?","o":["Верхнечелюстная пазуха","Клиновидная пазуха","Носослёзный канал","Лобная пазуха"],"a":2,"e":"Только носослёзный канал — поэтому при плаче течёт из носа."},{"q":"В какой носовой ход открывается верхнечелюстная пазуха?","o":["В верхний","В нижний","В общий","В средний"],"a":3,"e":"В средний — вместе с лобной пазухой и передними/средними ячейками."},{"q":"Куда открываются клиновидная пазуха и задние решётчатые ячейки?","o":["В верхний носовой ход","В средний носовой ход","В нижний носовой ход","В глазницу"],"a":0,"e":"Они лежат глубже и выше — открываются в верхний ход."},{"q":"Какие три ямки видны в латеральной норме?","o":["Передняя, средняя и задняя черепные","Височная, подвисочная и крыловидно-нёбная","Клыковая, височная и нижнечелюстная","Глазница, полость носа и полость рта"],"a":1,"e":"Черепные ямки — это внутреннее основание, сбоку их не видно."},{"q":"Какой стенки нет у подвисочной ямки?","o":["Передней","Медиальной","Нижней","Латеральной"],"a":2,"e":"Нижней стенки нет — ямка открыта вниз, к шее."},{"q":"Что образует латеральную стенку подвисочной ямки?","o":["Скуловая дуга","Бугор верхней челюсти","Крыловидный отросток","Ветвь нижней челюсти"],"a":3,"e":"Латерально — ветвь нижней челюсти; спереди — бугор; медиально — крыловидный отросток."},{"q":"Через что крыловидно-нёбная ямка сообщается с полостью рта?","o":["Через большой нёбный канал","Через круглое отверстие","Через нижнюю глазничную щель","Через клиновидно-нёбное отверстие"],"a":0,"e":"Большой нёбный канал выходит на твёрдое нёбо большим нёбным отверстием."},{"q":"Через что крыловидно-нёбная ямка сообщается с полостью черепа?","o":["Через овальное отверстие","Через остистое отверстие","Через круглое отверстие","Через рваное отверстие"],"a":2,"e":"Круглое отверстие — путь верхнечелюстного нерва."},{"q":"Через что крыловидно-нёбная ямка сообщается с глазницей?","o":["Через верхнюю глазничную щель","Через нижнюю глазничную щель","Через зрительный канал","Через носослёзный канал"],"a":1,"e":"Нижняя глазничная щель. Верхняя ведёт из глазницы в полость черепа."},{"q":"Почему синхондрозы основания черепа — «слабые места»?","o":["Там кость толще","Через них проходят сосуды","По ним часто проходят переломы основания черепа","На их месте роднички"],"a":2,"e":"Хрящ слабее кости — перелом основания часто идёт по синхондрозам."},{"q":"Какая кость вместе с лобной образует переднюю черепную ямку?","o":["Решётчатая","Затылочная","Височная","Теменная"],"a":0,"e":"Глазничные части лобной + решётчатая пластинка решётчатой кости."},{"q":"Где находится скат (clivus)?","o":["В передней черепной ямке","В средней черепной ямке","В задней черепной ямке, кпереди от большого отверстия","На своде черепа"],"a":2,"e":"Скат — наклонная площадка в задней ямке перед большим отверстием."},{"q":"В какой черепной ямке круглое, овальное и остистое отверстия?","o":["В передней","В средней","В задней","Ни в одной"],"a":1,"e":"Они на больших крыльях клиновидной кости, а те образуют среднюю ямку."},{"q":"Что называют стекловидной пластинкой?","o":["Наружную пластинку кости свода","Диплоэ","Надкостницу","Внутреннюю компактную пластинку кости свода"],"a":3,"e":"Внутренняя пластинка тоньше и хрупче наружной. Диплоэ — губчатое вещество между пластинками."},{"q":"Как окостеневают кости свода черепа?","o":["Энхондрально","Эндесмально, без стадии хряща","Перихондрально","Не окостеневают"],"a":1,"e":"Свод — эндесмально (прямой остеогенез); основание — энхондрально, через хрящ."},{"q":"Какой родничок самый большой и закрывается к 2 годам?","o":["Передний","Задний","Клиновидный","Сосцевидный"],"a":0,"e":"Передний — ромбовидный, между лобной и теменными костями."},{"q":"Черепной индекс равен 85. Какая это форма черепа?","o":["Долихокранная","Мезокранная","Нормокранная","Брахикранная"],"a":3,"e":"Больше 80 — брахикранный (короткий, широкий); до 75 — долихокранный; 75–80 — мезокранный."}],"facts":["Норма — вид черепа с определённой стороны: лицевая (спереди), латеральная (сбоку), базилярная (снизу), вертикальная (сверху).","Глазница — четырёхсторонняя пирамида: 4 стенки, вход (основание) обращён вперёд; ведут в неё зрительный канал, верхняя и нижняя глазничные щели.","Полость носа: вход — грушевидная апертура, выход — хоаны; 3 раковины и 3 носовых хода; перегородка = перпендикулярная пластинка решётчатой кости + сошник.","Средний носовой ход — лобная и верхнечелюстная пазухи, передние и средние ячейки; верхний — клиновидная пазуха и задние ячейки; нижний — носослёзный канал.","Латеральная норма: височная, подвисочная и крыловидно-нёбная ямки.","Крыловидно-нёбная ямка: спереди — бугор верхней челюсти, сзади — крыловидный отросток, медиально — нёбная кость; связана с глазницей, носом, черепом, ртом.","Внутреннее основание: передняя, средняя и задняя черепные ямки; в задней — большое отверстие и скат.","Свод: 2 компактные пластинки + диплоэ; внутренняя пластинка — стекловидная.","Кости свода — эндесмальное окостенение (без хряща), кости основания — энхондральное (через хрящ).","Роднички: передний, задний, клиновидные, сосцевидные; самый большой — передний (закрывается к 2 годам)."]},{"id":5,"name":"Скелет верхней и нижней конечности","q":[{"q":"Из каких костей состоит пояс верхней конечности?","o":["Лопатка и ключица","Плечевая кость и лопатка","Ключица и грудина","Тазовая кость"],"a":0,"e":"Пояс — лопатка и ключица. Плечевая кость — уже свободная часть."},{"q":"Какая кость конечностей проходит только 2 стадии развития?","o":["Плечевая","Лопатка","Бедренная","Ключица"],"a":3,"e":"Ключица — перепончатая и костная стадии, без хряща."},{"q":"Где в трубчатой кости появляется первичная точка окостенения?","o":["В эпифизе","В метафизе","В диафизе","В суставном хряще"],"a":2,"e":"Первичная — в диафизе (2-й месяц), вторичные — в эпифизах."},{"q":"За счёт чего трубчатая кость растёт в длину?","o":["За счёт надкостницы","За счёт эпифизарного хряща в метафизе","За счёт костного мозга","За счёт суставного хряща"],"a":1,"e":"Эпифизарный хрящ — зона роста до 18–25 лет. Надкостница — рост в толщину."},{"q":"На каком углу лопатки суставная впадина?","o":["На верхнем","На нижнем","На латеральном","На медиальном"],"a":2,"e":"На латеральном — с ней сочленяется головка плечевой кости."},{"q":"Где находится хирургическая шейка плечевой кости?","o":["Между головкой и бугорками","Ниже бугорков, на границе с телом","На нижнем конце кости","На лопатке"],"a":1,"e":"Место частых переломов. Между головкой и бугорками — анатомическая шейка."},{"q":"С какой костью сочленяется блок плечевой кости?","o":["С локтевой","С лучевой","С лопаткой","С костями запястья"],"a":0,"e":"Блок — к блоковидной вырезке локтевой кости; головка мыщелка — к лучевой."},{"q":"Какая кость предплечья лежит со стороны большого пальца?","o":["Локтевая","Плечевая","Лучевая","Малоберцовая"],"a":2,"e":"Лучевая — латерально (большой палец), локтевая — со стороны мизинца."},{"q":"Где находится локтевой отросток (olecranon)?","o":["На нижнем конце локтевой кости","На теле локтевой кости","На головке лучевой кости","На верхнем конце локтевой кости"],"a":3,"e":"На верхнем конце — это то, что мы называем «локоть»."},{"q":"Как называется поворот кисти ладонью вниз?","o":["Супинация","Пронация","Сгибание","Отведение"],"a":1,"e":"Пронация — ладонь вниз; супинация — вверх («суп в ладони»)."},{"q":"Сколько костей в запястье?","o":["8","7","5","14"],"a":0,"e":"8 костей в 2 ряда по 4. Семь — это предплюсна."},{"q":"Какая кость входит в проксимальный ряд запястья?","o":["Головчатая","Крючковидная","Кость-трапеция","Ладьевидная"],"a":3,"e":"Проксимальный ряд: ладьевидная, полулунная, трёхгранная, гороховидная."},{"q":"Сколько фаланг у большого пальца кисти?","o":["1","2","3","4"],"a":1,"e":"Только проксимальная и дистальная."},{"q":"Из каких костей состоит тазовая кость?","o":["Подвздошной, лобковой и седалищной","Крестца и копчика","Подвздошной и бедренной","Лобковой и крестца"],"a":0,"e":"Три кости, до 14–17 лет соединены хрящом."},{"q":"Где срастаются тела трёх костей тазовой кости?","o":["В симфизе","В запирательном отверстии","В вертлужной впадине","В подвздошном гребне"],"a":2,"e":"Вертлужная впадина — ямка для головки бедра."},{"q":"На какое образование тазовой кости мы опираемся сидя?","o":["На седалищную ость","На лобковый бугорок","На крыло подвздошной кости","На седалищный бугор"],"a":3,"e":"Седалищный бугор. Седалищная ость разделяет большую и малую вырезки."},{"q":"Какая кость скелета самая длинная?","o":["Плечевая","Большеберцовая","Бедренная","Малоберцовая"],"a":2,"e":"Бедренная — самая длинная и прочная."},{"q":"Что такое надколенник?","o":["Плоская кость","Сесамовидная кость в сухожилии четырёхглавой мышцы","Часть большеберцовой кости","Губчатая кость предплюсны"],"a":1,"e":"Самая крупная сесамовидная кость; защищает колено, увеличивает силу мышцы."},{"q":"Какой кости принадлежит медиальная лодыжка?","o":["Большеберцовой","Малоберцовой","Таранной","Пяточной"],"a":0,"e":"Медиальная — большеберцовой, латеральная — малоберцовой."},{"q":"Какая кость связывает голень с остальной стопой?","o":["Пяточная","Ладьевидная","Таранная","Кубовидная"],"a":2,"e":"Таранная — через неё вес передаётся с голени на стопу."},{"q":"Сколько костей в предплюсне?","o":["5","8","6","7"],"a":3,"e":"Таранная, пяточная, ладьевидная, кубовидная и 3 клиновидные."},{"q":"Чем женский таз отличается от мужского?","o":["Он уже и выше","Он шире и ниже, все размеры больше","Ничем","Крылья подвздошных костей вертикальнее"],"a":1,"e":"Шире и ниже; крылья и седалищные бугры развёрнуты кнаружи."}],"facts":["Скелет конечности = пояс + свободная часть (3 отдела: проксимальный, средний, дистальный).","Пояс верхней конечности: лопатка + ключица; к туловищу крепится в одном месте (грудино-ключичный сустав) → большой объём движений.","Ключица — единственная кость конечностей, которая проходит 2 стадии развития (перепончатую и костную), без хряща.","Плечевая кость: головка, анатомическая шейка, большой и малый бугорки, хирургическая шейка (частые переломы), мыщелок с блоком и головкой мыщелка.","Предплечье: локтевая — медиально (со стороны мизинца), лучевая — латерально (со стороны большого пальца); лучевая вращается вокруг локтевой (пронация/супинация).","Кисть: 8 костей запястья в 2 ряда + 5 пястных + фаланги (в I пальце 2, в остальных по 3).","Тазовая кость = подвздошная + лобковая + седалищная, срастаются в 14–17 лет в области вертлужной впадины.","Бедренная — самая длинная кость: головка, шейка, большой и малый вертелы, внизу 2 мыщелка; надколенник — самая крупная сесамовидная кость.","Голень: большеберцовая — медиально, массивная (медиальная лодыжка); малоберцовая — латерально, тонкая (латеральная лодыжка).","Стопа: 7 костей предплюсны (таранная, пяточная, ладьевидная, кубовидная, 3 клиновидные) + 5 плюсневых + фаланги; продольный и поперечный своды."]},{"id":6,"name":"Соединения костей","q":[{"q":"Как называются непрерывные соединения костей?","o":["Диартрозы","Синартрозы","Амфиартрозы","Суставы"],"a":1,"e":"Синартрозы — кости соединены тканью, щели нет. Диартрозы — суставы, амфиартрозы — тугие суставы."},{"q":"Что такое симфиз?","o":["Сустав с капсулой","Костное соединение","Хрящевое соединение с небольшой щелью внутри (полусустав)","Шов"],"a":2,"e":"Переходная форма: хрящ со щелью без капсулы. Пример — лобковый симфиз."},{"q":"Какой шов соединяет височную и теменную кости?","o":["Зубчатый","Плоский","Схиндилез","Чешуйчатый"],"a":3,"e":"Чешуйчатый — край накладывается как чешуйка. Зубчатый — кости свода, плоский — кости лица."},{"q":"Как называется соединение корня зуба с альвеолой?","o":["Вколачивание (зубоальвеолярный синдесмоз)","Синхондроз","Шов","Сустав"],"a":0,"e":"Гомфоз — зуб как будто «вбит» в лунку."},{"q":"Что удерживает зуб в альвеоле?","o":["Жёлтые связки","Волокна периодонта","Межкостная перепонка","Суставной хрящ"],"a":1,"e":"Волокна периодонта идут в разных направлениях и работают как амортизатор."},{"q":"Где расположены жёлтые связки?","o":["Между телами позвонков","Между остистыми отростками","Между дугами позвонков","В ВНЧС"],"a":2,"e":"Между дугами; эластичные, поэтому желтоватые."},{"q":"Что из перечисленного — постоянный синхондроз?","o":["Эпифизарный хрящ","Хрящ между частями тазовой кости у ребёнка","Лобковый симфиз","Соединение пирамиды височной кости с клиновидной"],"a":3,"e":"Сохраняется всю жизнь. Эпифизарный хрящ и хрящ тазовой кости — временные."},{"q":"Что такое синостоз?","o":["Соединение костной тканью","Соединение хрящом","Соединение связкой","Сустав"],"a":0,"e":"Сращение костью: крестец, половины нижней челюсти."},{"q":"Что НЕ относится к обязательным элементам сустава?","o":["Суставные поверхности","Суставная капсула","Суставная полость","Мениск"],"a":3,"e":"Мениск — вспомогательный элемент (есть в коленном суставе)."},{"q":"Что выделяет синовиальную жидкость?","o":["Фиброзная мембрана","Синовиальная мембрана","Суставной хрящ","Связки"],"a":1,"e":"Внутренний слой капсулы — синовиальная мембрана."},{"q":"Какое давление в полости сустава?","o":["Ниже атмосферного","Выше атмосферного","Равно атмосферному","Давления нет"],"a":0,"e":"Отрицательное — атмосферное давление прижимает кости друг к другу."},{"q":"Какой сустав называют сложным?","o":["С диском внутри","Образованный 2 костями","Образованный 3 и более костями","Два отдельных сустава, работающих вместе"],"a":2,"e":"Например, локтевой. С диском — комплексный, отдельные вместе — комбинированный."},{"q":"Какой из этих суставов комбинированный?","o":["Плечевой","Локтевой","Коленный","Правый и левый ВНЧС"],"a":3,"e":"Челюсть не может двигаться только в одном ВНЧС."},{"q":"Чем комплексный сустав отличается от простого?","o":["Внутри есть диск или мениск","Числом костей","Формой поверхностей","У него нет капсулы"],"a":0,"e":"Диск (ВНЧС) или мениски (коленный)."},{"q":"Какую форму имеют межфаланговые суставы пальцев?","o":["Шаровидную","Блоковидную","Седловидную","Плоскую"],"a":1,"e":"Блоковидные — только сгибание и разгибание."},{"q":"Какой сустав седловидный?","o":["Лучезапястный","Коленный","Запястно-пястный сустав большого пальца","Плечевой"],"a":2,"e":"Поэтому большой палец противопоставляется остальным."},{"q":"К какому виду относится тазобедренный сустав?","o":["Шаровидный, самый свободный","Плоский","Блоковидный","Чашеобразный"],"a":3,"e":"Чашеобразный — глубокая впадина, устойчивее плечевого."},{"q":"Чем образован ВНЧС?","o":["Головкой нижней челюсти, нижнечелюстной ямкой и суставным бугорком височной кости","Венечным отростком и скуловой дугой","Головкой нижней челюсти и затылочным мыщелком","Головкой нижней челюсти и клиновидной костью"],"a":0,"e":"Венечный отросток в сустав не входит — к нему крепится височная мышца."},{"q":"Что делит полость ВНЧС на два этажа?","o":["Мениск","Суставной диск","Суставная губа","Связка"],"a":1,"e":"Диск делит полость полностью; мениск — неполностью."},{"q":"Какая мышца прикрепляется к переднему отделу диска ВНЧС?","o":["Височная","Жевательная","Латеральная крыловидная","Медиальная крыловидная"],"a":2,"e":"Тянет диск с головкой вперёд при открывании рта."},{"q":"Частью чего является студенистое ядро?","o":["Межпозвоночного диска","Диска ВНЧС","Мениска коленного сустава","Лобкового симфиза"],"a":0,"e":"Центр межпозвоночного диска, остаток хорды; снаружи — фиброзное кольцо."},{"q":"Какая связка не даёт чрезмерно разогнуть позвоночник?","o":["Задняя продольная","Жёлтые","Выйная","Передняя продольная"],"a":3,"e":"Передняя тормозит разгибание, задняя — сгибание."},{"q":"Какую форму имеет срединный атлантоосевой сустав?","o":["Эллипсовидную","Цилиндрическую","Плоскую","Шаровидную"],"a":1,"e":"Атлант вращается вокруг зуба — повороты головы «нет-нет»."},{"q":"Какие движения возможны в атлантозатылочном суставе?","o":["Повороты головы влево-вправо","Только вращение","Кивки и наклоны головы в стороны","Никакие"],"a":2,"e":"Эллипсовидный, двуосный: «да-да» и наклоны к плечам."}],"facts":["Соединения: непрерывные (синартрозы) — без полости, мало- или неподвижные; прерывные (диартрозы, суставы) — с полостью, подвижные; переходные — симфизы (полусуставы).","Синартрозы: фиброзные (синдесмоз, межкостная перепонка, шов, вколачивание), хрящевые (синхондроз, симфиз), костные (синостоз).","Швы черепа: зубчатый, чешуйчатый, плоский, схиндилез. Зубоальвеолярный синдесмоз (вколачивание) — зуб в альвеоле на волокнах периодонта.","Обязательные элементы сустава: суставные поверхности (покрыты хрящом), суставная капсула (фиброзная + синовиальная мембраны), суставная полость с синовией.","Вспомогательные элементы: связки, суставные диски и мениски, суставные губы, сесамовидные кости, синовиальные сумки.","По числу костей: простой (2 кости), сложный (3 и более), комплексный (есть диск/мениск), комбинированный (анатомически отдельные суставы работают вместе).","По осям: одноосные (цилиндрический, блоковидный), двуосные (эллипсовидный, мыщелковый, седловидный), многоосные (шаровидный, чашеобразный, плоский).","ВНЧС: головка нижней челюсти + нижнечелюстная ямка и суставной бугорок височной кости; эллипсовидный, комплексный (диск делит на 2 этажа), комбинированный.","Межпозвоночный диск = фиброзное кольцо снаружи + студенистое ядро в центре; передняя продольная связка тормозит разгибание, задняя — сгибание.","Атлантозатылочный сустав — эллипсовидный (кивки и наклоны); срединный атлантоосевой — цилиндрический (повороты головы вокруг зуба)."]}];
const L = ['А','Б','В','Г'];
const RECOMMENDED = 75;
const KEY = 'anat-osteo-v1';
const BROWN = '#6b4a3a';

/* ---------- милые рисунки ---------- */
const eyes = (x1, x2, y) => `<circle cx="${x1}" cy="${y}" r="1.8" fill="${BROWN}"/><circle cx="${x2}" cy="${y}" r="1.8" fill="${BROWN}"/>`;
const smile = (x, y) => `<path d="M${x-3} ${y} q3 3 6 0" stroke="${BROWN}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
const blush = (x1, x2, y) => `<circle cx="${x1}" cy="${y}" r="2.2" fill="#f2a2a2" opacity=".7"/><circle cx="${x2}" cy="${y}" r="2.2" fill="#f2a2a2" opacity=".7"/>`;
const SHAPES = {
  bone: c => `<g fill="${c}"><circle cx="11" cy="17" r="6"/><circle cx="11" cy="29" r="6"/><circle cx="37" cy="17" r="6"/><circle cx="37" cy="29" r="6"/><rect x="11" y="17" width="26" height="12" rx="5"/></g>${eyes(20,28,22)}${smile(24,25)}`,
  tooth: c => `<path d="M13 9c4-3 8-1 11 0 3-1 7-3 11 0 4 3 3 10 1 14-1 3-1 6-2 10-1 5-5 5-6 0l-2-7c-1-2-3-2-4 0l-2 7c-1 5-5 5-6 0-1-4-1-7-2-10-2-4-3-11 1-14z" fill="${c}"/>${eyes(19,29,18)}${blush(16,32,22)}${smile(24,22)}`,
  heart: c => `<path d="M24 41S9 32 9 21a8 8 0 0 1 15-4 8 8 0 0 1 15 4c0 11-15 20-15 20z" fill="${c}"/>${eyes(19,29,23)}${blush(16,32,27)}${smile(24,27)}`,
  skull: c => `<path d="M24 7c-10 0-16 7-16 15 0 5 2 8 5 10v5c0 2 1 3 3 3h16c2 0 3-1 3-3v-5c3-2 5-5 5-10 0-8-6-15-16-15z" fill="${c}"/><circle cx="18" cy="23" r="3.6" fill="${BROWN}"/><circle cx="30" cy="23" r="3.6" fill="${BROWN}"/><circle cx="19" cy="22" r="1" fill="#fff"/><circle cx="31" cy="22" r="1" fill="#fff"/><path d="M22 31l2-3 2 3z" fill="${BROWN}"/><path d="M19 37v3M24 37v3M29 37v3" stroke="${BROWN}" stroke-width="1.5" stroke-linecap="round"/>`,
  vertebra: c => `<g fill="${c}"><ellipse cx="24" cy="18" rx="12" ry="8"/><rect x="5" y="22" width="38" height="7" rx="3.5"/><rect x="20" y="24" width="8" height="17" rx="4"/></g><ellipse cx="24" cy="26" rx="4" ry="3" fill="#fff" opacity=".85"/>${eyes(20,28,16)}${smile(24,19)}`,
  plus: c => `<g fill="${c}"><rect x="18" y="8" width="12" height="32" rx="5"/><rect x="8" y="18" width="32" height="12" rx="5"/></g>`,
  pill: c => `<g transform="rotate(-35 24 24)"><rect x="8" y="17" width="32" height="14" rx="7" fill="#fff"/><path d="M15 17h9v14h-9a7 7 0 0 1 0-14z" fill="${c}"/><rect x="8" y="17" width="32" height="14" rx="7" fill="none" stroke="${c}" stroke-width="2"/></g>`,
  star: c => `<path d="M24 5l4.5 14.5L43 24l-14.5 4.5L24 43l-4.5-14.5L5 24l14.5-4.5z" fill="${c}"/>`,
  joint: c => `<g fill="${c}"><rect x="21" y="3" width="8" height="18" rx="4"/><rect x="21" y="27" width="8" height="18" rx="4"/><circle cx="25" cy="24" r="8"/></g><circle cx="25" cy="24" r="3.5" fill="#fff" opacity=".85"/>`,
  hand: c => `<g fill="${c}"><rect x="13" y="22" width="22" height="18" rx="7"/><rect x="13" y="9" width="5" height="17" rx="2.5"/><rect x="19.5" y="6" width="5" height="18" rx="2.5"/><rect x="26" y="8" width="5" height="17" rx="2.5"/><rect x="32" y="13" width="5" height="14" rx="2.5"/><rect x="6" y="22" width="12" height="5" rx="2.5" transform="rotate(30 12 24)"/></g>${eyes(21,27,31)}${smile(24,34)}`,
};
function svg(name, color){ return `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">${SHAPES[name](color)}</svg>`; }

const THEMES = {
  0: { tint:'#fbf3e9', soft:'#f6e6d6', accent:'#c48a64', art:['heart','bone','tooth'], pat:['heart','bone','tooth','star','plus','skull'] },
  1: { tint:'#f5f1fb', soft:'#e7dff7', accent:'#8f78c4', art:['vertebra','heart','bone'], pat:['vertebra','bone','heart','star','plus','vertebra'] },
  2: { tint:'#fdf3ee', soft:'#fbe0d2', accent:'#d4805e', art:['skull','star','heart'], pat:['skull','star','plus','heart','skull','star'] },
  3: { tint:'#eff8f3', soft:'#d6eedf', accent:'#4f9a76', art:['tooth','star','tooth'], pat:['tooth','star','tooth','plus','heart','tooth'] },
  4: { tint:'#fdf8ea', soft:'#f8e9bd', accent:'#b98a2c', art:['skull','plus','star'], pat:['skull','plus','star','skull','heart','pill'] },
  5: { tint:'#fdf1f4', soft:'#f8d9e2', accent:'#c86d88', art:['hand','heart','bone'], pat:['bone','hand','heart','star','bone','plus'] },
  6: { tint:'#eff5fb', soft:'#d9e8f6', accent:'#5b8cbd', art:['joint','pill','bone'], pat:['joint','pill','bone','plus','star','joint'] },
};
function pattern(t){
  const pos = [[18,20,-12],[150,14,14],[86,96,6],[214,108,-20],[22,168,18],[146,190,-8]];
  const cols = [t.accent, t.soft, t.accent, t.soft, t.accent, t.soft];
  const items = t.pat.map((n, i) => `<svg x="${pos[i][0]}" y="${pos[i][1]}" width="46" height="46" viewBox="0 0 48 48"><g transform="rotate(${pos[i][2]} 24 24)">${SHAPES[n](cols[i])}</g></svg>`).join('');
  const s = `<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280"><g opacity=".38">${items}</g></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(s)}")`;
}
function applyTheme(id){
  const t = THEMES[id] || THEMES[0], r = document.documentElement.style;
  r.setProperty('--tint', t.tint); r.setProperty('--soft', t.soft); r.setProperty('--accent', t.accent);
  r.setProperty('--pattern', pattern(t));
}

/* ---------- состояние ---------- */
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { store = {}; }
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
let cur = null, answers = [];
const narrow = () => window.matchMedia('(max-width:760px)').matches;

const level = p => p >= RECOMMENDED ? 'ok' : p >= 60 ? 'mid' : 'bad';
function grade(p){
  if (p >= 90) return 'Отлично — тему знаешь уверенно';
  if (p >= 75) return 'Хорошо — тема усвоена';
  if (p >= 60) return 'Удовлетворительно — повтори слабые места';
  return 'Тему нужно повторить по конспекту';
}
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/\*\*/g, '');
function badge(t){
  const r = store['t' + t.id];
  return r ? `<span class="badge ${level(r.pct)}">Решён · ${r.pct}%</span>` : `<span class="badge">${t.q.length} вопросов</span>`;
}
function topicVars(id){ const t = THEMES[id]; return `--tsoft:${t.soft};--tacc:${t.accent}`; }

function renderTopics(){
  document.getElementById('topics').innerHTML = DATA.map(t => `
    <button class="topic ${cur && cur.id === t.id ? 'active' : ''}" data-id="${t.id}" style="${topicVars(t.id)}">
      <span class="ticon">${svg(THEMES[t.id].art[0], THEMES[t.id].accent)}</span>
      <span><span class="tname">${t.id}. ${esc(t.name)}</span><br>${badge(t)}</span></button>`).join('');
  document.querySelectorAll('.topic').forEach(b => b.onclick = () => { openTopic(+b.dataset.id); if (narrow()) setOpen(false); });
}

function setOpen(open){ document.body.classList.toggle('closed', !open); }
document.getElementById('burger').onclick = () => setOpen(document.body.classList.contains('closed'));
document.getElementById('backdrop').onclick = () => setOpen(false);

function openTopic(id){
  cur = DATA.find(t => t.id === id);
  answers = new Array(cur.q.length).fill(null);
  applyTheme(id);
  try { history.replaceState(null, '', '#tema-' + id); } catch (e) {}
  renderTopics();
  const th = THEMES[id];
  document.getElementById('main').innerHTML = `
    <div class="hero"><div class="kicker">Тема ${cur.id} · ${cur.q.length} вопросов</div><h2>${esc(cur.name)}</h2>
      <div class="art">${th.art.map((n, i) => svg(n, i === 1 ? '#fff' : th.accent)).join('')}</div></div>
    <div class="progress"><span id="prog">Отвечено 0 из ${cur.q.length}</span><div class="bar"><i id="barfill"></i></div></div>
    <div id="qs">${cur.q.map((q, i) => `
      <div class="q" id="q${i}"><h3><span class="n">${i + 1}</span>${esc(q.q)}</h3>
        ${q.o.map((o, j) => `<button class="opt" data-q="${i}" data-o="${j}"><span class="l">${L[j]})</span><span class="t">${esc(o)}</span></button>`).join('')}
      </div>`).join('')}</div>
    <div id="end"></div>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.q, +b.dataset.o));
  window.scrollTo(0, 0);
}

function answer(i, j){
  if (answers[i] !== null) return;
  answers[i] = j;
  const q = cur.q[i], box = document.getElementById('q' + i), btns = box.querySelectorAll('.opt');
  btns.forEach((b, k) => { b.disabled = true; if (k !== q.a && k !== j) b.classList.add('dim'); });
  const right = btns[q.a], ok = j === q.a;
  right.classList.add('correct');
  if (ok) right.insertAdjacentHTML('beforeend', '<span class="tag">✓ твой ответ</span>');
  else {
    btns[j].classList.add('wrong');
    btns[j].insertAdjacentHTML('beforeend', '<span class="tag">✗ твой ответ</span>');
    right.insertAdjacentHTML('beforeend', '<span class="tag">✓ верно</span>');
  }
  right.insertAdjacentHTML('afterend', `<div class="expl"><div class="verdict ${ok ? 'ok' : 'bad'}">${ok ? 'Верно!' : 'Неверно. Правильный ответ — ' + L[q.a] + '.'}</div>${esc(q.e)}</div>`);
  const done = answers.filter(a => a !== null).length;
  document.getElementById('prog').textContent = `Отвечено ${done} из ${cur.q.length}`;
  document.getElementById('barfill').style.width = (100 * done / cur.q.length) + '%';
  if (done === cur.q.length) finish();
}

function finish(){
  const n = cur.q.length, ok = answers.filter((a, i) => a === cur.q[i].a).length;
  const pct = Math.round(100 * ok / n), lv = level(pct), th = THEMES[cur.id];
  store['t' + cur.id] = { pct, ok, n }; persist(); renderTopics();
  const wrong = answers.map((a, i) => a === cur.q[i].a ? null : i + 1).filter(Boolean);
  const col = lv === 'ok' ? 'var(--ok)' : lv === 'mid' ? 'var(--mid)' : 'var(--bad)';
  document.getElementById('end').innerHTML = `
    <div class="result ${lv}">
      <div class="lbl">Тест пройден</div>
      <div class="row">
        <div><div class="big">${ok} / ${n}</div><div class="lbl">баллов</div></div>
        <div><div class="big" style="color:${col}">${pct}%</div><div class="lbl">знание темы</div></div>
        <div><div class="big" style="color:var(--muted)">${RECOMMENDED}%</div><div class="lbl">рекомендуемый минимум</div></div>
      </div>
      <div style="font-weight:800">${grade(pct)}</div>
      ${wrong.length ? `<div class="hint" style="margin-top:4px">Ошибки в вопросах: ${wrong.join(', ')}</div>` : ''}
      <div class="scale">90% и выше — отлично · 75–89% — хорошо · 60–74% — удовлетворительно · ниже 60% — повторить</div>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="again">Пройти заново</button>
        ${cur.id < DATA.length ? `<button class="btn ghost" id="next">Следующая тема →</button>` : ''}
      </div>
    </div>
    <div class="facts"><h3>${svg('star', th.accent)}10 вопросов, которые обязательно зададут</h3>
      <ol>${cur.facts.map(f => `<li>${esc(f)}</li>`).join('')}</ol></div>`;
  document.getElementById('again').onclick = () => openTopic(cur.id);
  const nx = document.getElementById('next'); if (nx) nx.onclick = () => openTopic(cur.id + 1);
  document.getElementById('end').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function home(){
  cur = null; applyTheme(0); renderTopics();
  const th = THEMES[0];
  document.getElementById('main').innerHTML = `
    <div class="hero"><div class="kicker">Остеология · Артросиндесмология</div><h2>Тесты по 6 темам</h2>
      <div class="art">${th.art.map((n, i) => svg(n, i === 1 ? '#fff' : th.accent)).join('')}</div></div>
    <p class="hint" style="background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin:0">Выбери тему. После каждого ответа правильный вариант подсветится зелёным, а под ним появится короткое пояснение. В конце — баллы, процент и 10 главных вопросов по теме.</p>
    <div class="homegrid">${DATA.map(t => `<button class="homecard" data-id="${t.id}" style="${topicVars(t.id)}">
      <span class="ticon">${svg(THEMES[t.id].art[0], THEMES[t.id].accent)}</span>
      <span><b>${t.id}. ${esc(t.name)}</b><br>${badge(t)}</span></button>`).join('')}</div>`;
  document.querySelectorAll('.homecard').forEach(b => b.onclick = () => openTopic(+b.dataset.id));
}

function route(){
  const m = (location.hash || '').match(/^#tema-(\d)$/);
  if (m && DATA.find(t => t.id === +m[1])) { if (!cur || cur.id !== +m[1]) openTopic(+m[1]); }
  else home();
}
setOpen(!narrow());
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
